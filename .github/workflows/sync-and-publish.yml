name: Sync upstream tags and publish to npm

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.new_tag.outputs.has_new }}
      tag:     ${{ steps.new_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch tags
        run: |
          git remote add upstream https://github.com/numberwolf/h265web.js.git || true
          git fetch upstream --tags

      - name: Push all upstream tags to downstream
        run: |
          git push origin --tags

      - name: Merge upstream master into local master
        run: |
          git checkout -B master origin/master
          git merge upstream/master --no-edit || true
          git push origin master

      - name: Find latest new upstream tag
        id: new_tag
        run: |
          LATEST=""
          for TAG in $(git tag -l "v*" --sort=-version:refname); do
            if git rev-parse "refs/tags/published-$TAG" >/dev/null 2>&1; then
              continue
            fi
            LATEST="$TAG"
            break
          done

          if [ -z "$LATEST" ]; then
            echo "Up to date."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest new tag: $LATEST"
          echo "has_new=true"  >> "$GITHUB_OUTPUT"
          echo "tag=$LATEST"   >> "$GITHUB_OUTPUT"

  publish:
    needs: sync
    if: needs.sync.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: checkout upstream tag content
        run: |
          TAG="${{ needs.sync.outputs.tag }}"
          git remote add upstream https://github.com/numberwolf/h265web.js.git || true
          git fetch upstream "refs/tags/$TAG:refs/tags/$TAG"
          git checkout "$TAG" -- .

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${{ needs.sync.outputs.tag }}"
          V="${TAG#v}"
          if [[ "$V" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            BASE="${V%%[!0-9]*}"; SUFFIX="${V#$BASE}"
            Y="${BASE:0:4}"; M="${BASE:4:2}"; D="${BASE:6:2}"
            PRE=$(echo "$SUFFIX" | sed 's/[^A-Za-z0-9]/-/g;s/^-//;s/-$//')
            VERSION="$Y.$M.$D"
            [ -n "$PRE" ] && VERSION="$VERSION-$PRE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate package.json
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          METHOD="${{ steps.download.outputs.method }}"
          FILES='["dist"]'
          [ "$METHOD" = "tag" ] && FILES='["static", "dist"]'
          cat > package.json <<EOF
          {
            "name": "h265web.js",
            "version": "${VERSION}",
            "description": "Mirror of numberwolf/h265web.js",
            "main": "static/h265web.js",
            "files": ${FILES},
            "publishConfig": { "access": "public" },
            "license": "SEE LICENSE IN LICENSE-Free_CN.MD"
          }
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create published marker tag
        run: |
          TAG="${{ needs.sync.outputs.tag }}"
          git tag "published-$TAG"
          git push origin "published-$TAG"
